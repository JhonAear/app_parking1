services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - parking_db:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8787
      DATABASE_URL: postgres://parking:parking@db:5432/parking
      ADMIN_USERS: admin
    ports:
      - "8787:8787"
    depends_on:
      - db

volumes:
  parking_db:

